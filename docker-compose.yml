version: '3.8'

services:
  nginx:
    image: nginx:alpine
    container_name: multi-env-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

  app:
    build: .
    container_name: multi-env-app
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      # Values are set to mirror your .env.development
      - NODE_ENV=development
      - PORT=3000
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=myapp_dev
      - DB_USER=postgres
      - DB_PASS=devpassword
      - JWT_SECRET=dev_jwt_secret_change_me
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:15-alpine
    container_name: multi-env-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=devpassword
      - POSTGRES_DB=myapp_dev
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d myapp_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
